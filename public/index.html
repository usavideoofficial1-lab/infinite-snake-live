<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless Auto Snake Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #0d0d0d; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh;
        }
        #app {
            position: relative; width: 100vw; height: 100vh; height: 100dvh;
            max-width: calc(100vh * 9 / 16); max-height: calc(100vw * 16 / 9);
            background-color: #000; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }
        
        /* Top UI - Simulating the Screenshot */
        .top-ui { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
        
        .sub-notify {
            display: flex; align-items: center; justify-content: space-between;
        }
        .sub-box {
            border: 2px solid #ef4444; border-radius: 8px; padding: 4px 10px;
            display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5);
        }
        .sub-box span { font-size: 11px; font-weight: bold; color: #fff; }
        .sub-box .bell { color: #fbbf24; font-size: 14px; }
        
        .level-box {
            border: 2px solid #eab308; border-radius: 20px; padding: 4px 15px;
            font-size: 12px; font-weight: 900; color: #fde047;
            text-shadow: 0 0 5px #eab308; background: rgba(0,0,0,0.7);
        }

        .gifts-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: #1f2937; border-radius: 20px; padding: 4px 10px;
            font-size: 10px; font-weight: bold;
        }
        .likes-pill {
            background: #374151; padding: 3px 10px; border-radius: 12px;
            display: flex; align-items: center; gap: 5px; font-size: 10px;
            border: 1px solid #4b5563;
        }
        .gifts-row {
            display: flex; justify-content: space-between; padding: 5px 12px;
            gap: 4px;
        }
        .gift-item {
            display: flex; flex-direction: column; align-items: center;
            background: #111827; padding: 6px 4px; border-radius: 8px;
            flex: 1; border: 1px solid #374151; font-size: 8px; color: #9ca3af;
        }
        .gift-item .icon { font-size: 16px; margin-bottom: 2px; }

        /* Game Canvas Area */
        .canvas-wrapper { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            background: #000; position: relative; padding: 0 10px;
        }
        canvas { 
            display: block; max-width: 100%; max-height: 100%; 
            border: 2px solid #6b8e23; box-shadow: 0 0 15px rgba(107, 142, 35, 0.4);
        }
        
        /* Notification */
        .notification {
            position: absolute; top: 10%; left: 50%; transform: translate(-50%, -20px);
            background: rgba(0, 0, 0, 0.9); border: 1px solid #4ade80; padding: 10px 20px;
            border-radius: 8px; font-size: 16px; font-weight: bold; color: #4ade80;
            text-shadow: 0 0 10px #4ade80; opacity: 0; transition: all 0.3s ease;
            pointer-events: none; text-align: center; z-index: 20; width: 80%;
        }
        .notification.show { opacity: 1; transform: translate(-50%, 0); }

        /* Bottom Text */
        .bottom-text {
            text-align: center; font-size: 36px; font-weight: 900; color: #fff;
            padding: 10px 0; font-family: 'Arial', sans-serif;
        }
        .bottom-text span { color: #ff2d3f; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Top UI -->
        <div class="top-ui">
            <div class="sub-notify">
                <div class="sub-box">
                    <span class="bell">🔔</span>
                    <span>@top_supporter<br><span style="color:#9ca3af; font-weight:normal; font-size:9px;">thanks for subscribing!</span></span>
                </div>
                <div class="level-box" id="ui-level">LEVEL 1</div>
            </div>
            
            <div class="gifts-bar">
                <span>Game play gifts:</span>
                <div class="likes-pill">👍 LIKES <span id="ui-likes">1013</span> / 2000 <span style="color:#4ade80;">+50</span></div>
            </div>
            
            <div class="gifts-row">
                <div class="gift-item"><span class="icon">⭐</span>Star<br>+2</div>
                <div class="gift-item"><span class="icon">🦴</span>Bone<br>+5</div>
                <div class="gift-item"><span class="icon">🪙</span>Coin<br>+10</div>
                <div class="gift-item"><span class="icon">🎁</span>Box<br>+10</div>
                <div class="gift-item"><span class="icon">🎉</span>Party<br>+20</div>
                <div class="gift-item"><span class="icon">💩</span>Poop<br>+60</div>
                <div class="gift-item"><span class="icon">🦖</span>Dino<br>+250</div>
                <div class="gift-item"><span class="icon">👾</span>Super<br>+10000</div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="720" height="720"></canvas>
            <div id="notification" class="notification"></div>
        </div>

        <!-- Bottom Text -->
        <div class="bottom-text">67<span>=</span>ban</div>
    </div>
        <script>
        window.onerror = function(msg) {
            const notif = document.getElementById('notification');
            if(notif) {
                notif.textContent = "ERROR: " + msg; notif.style.color = "#ff0000";
                notif.style.borderColor = "#ff0000"; notif.classList.add('show');
            }
            return false;
        };

        (function() {
            'use strict';
            const COLS = 22, ROWS = 22, CELL = 32, W = COLS * CELL, H = ROWS * CELL;
            const TICK_SPEED = 75; 
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const ui = {
                level: document.getElementById('ui-level'),
                likes: document.getElementById('ui-likes'),
                notif: document.getElementById('notification')
            };

            // --- Audio ---
            let audioCtx = null;
            const initAudio = () => {
                if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            };
            window.addEventListener('click', initAudio, { once: true });
            window.addEventListener('touchstart', initAudio, { once: true });

            const playSound = (type) => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;
                    if (type === 'move') {
                        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.03);
                        gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                        osc.start(now); osc.stop(now + 0.04);
                    } else if (type === 'eat') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                        osc.frequency.setValueAtTime(900, now + 0.1);
                        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                    } else if (type === 'bomb') {
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
                        gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4);
                    }
                } catch(e) {}
            };

            // --- Game State ---
            let snake = [], dir = { x: 1, y: 0 };
            let apples = []; 
            let bombs = [];  
            let level = 1, likes = 1013;
            let lastTick = 0;

            // --- Optimization Buffers ---
            const occBuf = new Uint8Array(COLS * ROWS), visitedBuf = new Int32Array(COLS * ROWS);
            const queueBuf = new Int32Array(COLS * ROWS), parentBuf = new Int32Array(COLS * ROWS);
            const ffVisited = new Uint8Array(COLS * ROWS), ffStack = new Int32Array(COLS * ROWS);
            const DIRS = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];

            function resetRound() {
                const cy = Math.floor(ROWS / 2); snake = [];
                for (let i = 0; i < 5; i++) snake.push({ x: 4 - i, y: cy });
                dir = { x: 1, y: 0 }; 
                bombs = []; 
                apples = [];
                spawnApples(); 
            }

            function spawnApples() {
                while (apples.length < 2) {
                    let freeCells = [];
                    for (let i = 0; i < COLS * ROWS; i++) {
                        let x = i % COLS, y = Math.floor(i / COLS);
                        let isSnake = snake.some(s => s.x === x && s.y === y);
                        let isApple = apples.some(a => a.x === x && a.y === y);
                        let isBomb = bombs.some(b => b.x === x && b.y === y);
                        if (!isSnake && !isApple && !isBomb) freeCells.push(i);
                    }
                    if (freeCells.length > 0) {
                        const idx = freeCells[Math.floor(Math.random() * freeCells.length)];
                        apples.push({ x: idx % COLS, y: Math.floor(idx / COLS) });
                    } else break;
                }
            }

            function spawnBomb() {
                if (bombs.length >= 2) return; // Max 2 bombs at a time
                let freeCells = [];
                for (let j = 0; j < COLS * ROWS; j++) {
                    let x = j % COLS, y = Math.floor(j / COLS);
                    let isSnake = snake.some(s => s.x === x && s.y === y);
                    let isApple = apples.some(a => a.x === x && a.y === y);
                    let isBomb = bombs.some(b => b.x === x && b.y === y);
                    if (!isSnake && !isApple && !isBomb) freeCells.push(j);
                }
                if (freeCells.length > 0) {
                    const idx = freeCells[Math.floor(Math.random() * freeCells.length)];
                    bombs.push({ x: idx % COLS, y: Math.floor(idx / COLS) });
                }
            }

            function getFreeSpaceCount(startX, startY) {
                ffVisited.fill(0);
                let stackPtr = 0, count = 0;
                ffStack[stackPtr++] = startY * COLS + startX;
                ffVisited[startY * COLS + startX] = 1;
                while (stackPtr > 0) {
                    let curr = ffStack[--stackPtr]; count++;
                    let cx = curr % COLS, cy = Math.floor(curr / COLS);
                    for (let d of DIRS) {
                        let nx = cx + d.x, ny = cy + d.y;
                        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
                        let nIdx = ny * COLS + nx;
                        if (!ffVisited[nIdx] && !occBuf[nIdx]) {
                            ffVisited[nIdx] = 1; ffStack[stackPtr++] = nIdx;
                        }
                    }
                }
                return count;
            }

            function getNextMove() {
                const head = snake[0];
                occBuf.fill(0);
                for (let i = 0; i < snake.length; i++) occBuf[snake[i].y * COLS + snake[i].x] = 1;
                if (snake.length > 1) {
                    let tail = snake[snake.length - 1];
                    occBuf[tail.y * COLS + tail.x] = 0; 
                }

                // AI targets Apples
                let targetList = apples;
                if (targetList.length === 0) return null;

                // BFS to find closest Apple
                visitedBuf.fill(0);
                let headIdx = head.y * COLS + head.x;
                let qHead = 0, qTail = 0; 
                queueBuf[qTail++] = headIdx;
                visitedBuf[headIdx] = 1; 
                parentBuf[headIdx] = -1; 
                
                let foundTarget = null;

                while (qHead < qTail) {
                    let curr = queueBuf[qHead++];
                    let cx = curr % COLS, cy = Math.floor(curr / COLS);
                    
                    let isTarget = targetList.some(t => t.x === cx && t.y === cy);
                    if (isTarget) { foundTarget = curr; break; }

                    for (let d of DIRS) {
                        let nx = cx + d.x, ny = cy + d.y;
                        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
                        let nIdx = ny * COLS + nx;
                        if (visitedBuf[nIdx] || occBuf[nIdx]) continue; // Avoid snake body
                        visitedBuf[nIdx] = 1; 
                        parentBuf[nIdx] = curr; 
                        queueBuf[qTail++] = nIdx;
                    }
                }

                if (foundTarget !== null) {
                    let curr = foundTarget;
                    while (parentBuf[curr] !== headIdx) { 
                        curr = parentBuf[curr]; 
                        if (curr === -1) return null; 
                    }
                    return { x: (curr % COLS) - head.x, y: Math.floor(curr / COLS) - head.y };
                }

                // Survival Fallback
                let bestMove = null, maxSpace = -1;
                for (let d of DIRS) {
                    let nx = head.x + d.x, ny = head.y + d.y;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !occBuf[ny * COLS + nx]) {
                        let space = getFreeSpaceCount(nx, ny);
                        if (space > maxSpace) { maxSpace = space; bestMove = d; }
                    }
                }
                return bestMove;
            }

            function updateGame() {
                // Randomly spawn bombs
                if (bombs.length < 2 && Math.random() < 0.03) {
                    spawnBomb();
                }

                const nextDir = getNextMove();
                if (!nextDir) { 
                    // TRAPPED -> LEVEL UP (Infinite Game)
                    level++;
                    ui.level.textContent = "LEVEL " + level;
                    showNotification("LEVEL UP! CONTINUING...", "#eab308"); 
                    resetRound(); 
                    return; 
                }
                
                dir = nextDir; 
                const head = snake[0];
                const newHead = { x: head.x + dir.x, y: head.y + dir.y };
                
                snake.unshift(newHead); 
                playSound('move');

                // Check Bomb Collision
                let bombIdx = bombs.findIndex(b => b.x === newHead.x && b.y === newHead.y);
                if (bombIdx !== -1) {
                    playSound('bomb');
                    bombs.splice(bombIdx, 1);
                    if (snake.length > 3) snake.pop(); // Decrease exactly 1 step
                    showNotification("BOOM! -1 LENGTH", "#ef4444");
                } 
                // Check Apple Collision
                else {
                    let appleIdx = apples.findIndex(a => a.x === newHead.x && a.y === newHead.y);
                    if (appleIdx !== -1) {
                        playSound('eat'); 
                        likes += 5;
                        ui.likes.textContent = likes;
                        apples.splice(appleIdx, 1);
                        spawnApples(); 
                    } else { 
                        snake.pop(); 
                    }
                }
            }

            // --- Drawing ---
            function drawApple(cx, cy) {
                const r = CELL * 0.35;
                ctx.fillStyle = '#4ade80'; ctx.shadowBlur = 10; ctx.shadowColor = '#4ade80';
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.3, r*0.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#166534'; ctx.fillRect(cx-1, cy-r-3, 2, 4);
            }

            function drawBomb(cx, cy) {
                const r = CELL * 0.35;
                ctx.fillStyle = '#111'; ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444';
                ctx.beginPath(); ctx.arc(cx, cy + 2, r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.2, r*0.2, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#b45309'; ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(cx + 4, cy - r + 2); ctx.lineTo(cx + 8, cy - r - 8); ctx.stroke();
                ctx.fillStyle = '#ef4444'; ctx.shadowBlur = 15; ctx.shadowColor = '#ef4444';
                ctx.beginPath(); ctx.arc(cx + 8, cy - r - 8, 4, 0, Math.PI * 2); ctx.fill();
            }

            function draw() {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

                apples.forEach(a => drawApple(a.x * CELL + CELL / 2, a.y * CELL + CELL / 2));
                bombs.forEach(b => drawBomb(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2));

                for (let i = snake.length - 1; i >= 0; i--) {
                    const s = snake[i], sx = s.x * CELL + CELL / 2, sy = s.y * CELL + CELL / 2;
                    ctx.fillStyle = i === 0 ? '#8fbc8f' : '#6b8e23';
                    ctx.shadowBlur = i === 0 ? 10 : 0; ctx.shadowColor = '#6b8e23';
                    
                    ctx.beginPath(); 
                    ctx.roundRect(sx - CELL*0.4, sy - CELL*0.4, CELL*0.8, CELL*0.8, 8); 
                    ctx.fill();

                    if (i === 0) {
                        ctx.fillStyle = '#000'; ctx.shadowBlur = 0;
                        let eye1X = sx + (dir.x * 5) - (dir.y * 6), eye1Y = sy + (dir.y * 5) + (dir.x * 6);
                        let eye2X = sx + (dir.x * 5) + (dir.y * 6), eye2Y = sy + (dir.y * 5) - (dir.x * 6);
                        ctx.beginPath(); ctx.arc(eye1X, eye1Y, 3, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(eye2X, eye2Y, 3, 0, Math.PI * 2); ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;
            }

            let notifTimeout = null;
            function showNotification(text, color) {
                ui.notif.textContent = text; ui.notif.style.color = color; ui.notif.style.borderColor = color;
                ui.notif.classList.add('show'); clearTimeout(notifTimeout);
                notifTimeout = setTimeout(() => ui.notif.classList.remove('show'), 2000);
            }

            function loop(time) {
                requestAnimationFrame(loop);
                if (!lastTick) lastTick = time;
                if (time - lastTick >= TICK_SPEED) { updateGame(); lastTick = time; }
                draw();
            }

            try { resetRound(); requestAnimationFrame(loop); } 
            catch (e) { window.onerror(e.message, "inline", 0); }

            document.addEventListener('visibilitychange', () => { if (!document.hidden) lastTick = performance.now(); });
        })();
    </script>
</body>
</html>
