<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grandma Game Snake - 24/7 Live</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #09090b; color: #fff; font-family: 'Montserrat', sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh;
        }
        
        #app {
            position: relative; width: 100vw; height: 100vh; height: 100dvh;
            max-width: calc(100vh * 9 / 16); max-height: calc(100vw * 16 / 9);
            background-color: #09090b; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- Top UI Layout --- */
        .top-ui {
            padding: 12px 15px;
            background: #09090b;
            display: flex; flex-direction: column; gap: 8px;
            position: relative; z-index: 10; flex-shrink: 0;
        }

        .title-row {
            display: flex; align-items: flex-start; justify-content: space-between;
        }

        .title-group { display: flex; flex-direction: column; gap: 2px; }
        .title-group h1 {
            font-size: 32px; line-height: 0.9; font-weight: 900;
            color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
            letter-spacing: -1px;
        }
        .title-group h1 span { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        
        .level-badge {
            background: #eab308; color: #000; padding: 3px 10px;
            border-radius: 4px; font-size: 12px; font-weight: 900;
            display: inline-block; width: max-content; margin-top: 4px;
        }

        .cam-box {
            width: 70px; height: 90px; background: #1f2937;
            border: 2px solid #374151; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #6b7280; text-align: center; overflow: hidden;
        }

        .buttons-row {
            display: flex; gap: 8px; justify-content: space-between;
        }

        .btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
            padding: 6px; border-radius: 20px; font-size: 10px; font-weight: 800;
            background: rgba(0,0,0,0.5); border: 1px solid #4b5563;
        }
        .btn.like { border-color: #eab308; color: #eab308; }
        .btn.comment { border-color: #3b82f6; color: #3b82f6; }
        .btn .apple-icon { color: #22c55e; font-size: 12px; }

        /* --- Game Area --- */
        .canvas-wrapper {
            flex: 1; position: relative; display: flex;
            justify-content: center; align-items: center;
            padding: 5px 10px; overflow: hidden;
        }

        /* Perfect Square Canvas in 9:16 */
        canvas {
            display: block; 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            max-height: 100%;
            object-fit: contain;
            border: 2px solid #22c55e; 
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            background: #0a0a1a;
        }

        /* --- Level Up Overlay --- */
        .level-up-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease; z-index: 20; width: 100%;
        }
        .level-up-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        .level-up-overlay h2 {
            font-size: 36px; font-weight: 900; color: #fff; line-height: 1;
            text-shadow: 0 0 15px #a855f7, 0 0 30px #a855f7, 2px 2px 0 #000;
            letter-spacing: 1px;
        }
        .level-up-overlay p {
            font-size: 20px; font-weight: 900; color: #eab308;
            text-shadow: 0 0 10px #eab308, 2px 2px 0 #000; margin-top: 8px;
        }

        .bottom-brand {
            text-align: center; font-size: 30px; font-weight: 900;
            color: rgba(255,255,255,0.1); letter-spacing: 8px;
            padding: 10px 0; flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Top UI -->
        <div class="top-ui">
            <div class="title-row">
                <div class="title-group">
                    <h1>GRANDMA<br><span>GAME</span></h1>
                    <div class="level-badge" id="ui-level">LEVEL 1</div>
                </div>
                <div class="cam-box">CAM<br>FEED</div>
            </div>
            
            <div class="buttons-row">
                <div class="btn like">👍 1 LIKE = +5 <span class="apple-icon">🍏</span></div>
                <div class="btn comment">💬 1 COMMENT = +1 <span class="apple-icon">🍏</span></div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="canvas-wrapper">
            <!-- Internal resolution 690x690 (23x23 grid) -->
            <canvas id="gameCanvas" width="690" height="690"></canvas>
            
            <div class="level-up-overlay" id="levelUpOverlay">
                <h2>LEVEL UP!</h2>
                <p>⭐ LEVEL <span id="nextLevelText">2</span> ⭐</p>
            </div>
        </div>

        <div class="bottom-brand">67 = BAN</div>
    </div>
        <script>
        window.onerror = function(msg) { console.error(msg); return false; };

        (function() {
            'use strict';

            // --- Configuration ---
            const COLS = 23; // 23x23 grid for maze
            const ROWS = 23;
            const CELL = 30; // 23 * 30 = 690px
            const W = COLS * CELL;
            const H = ROWS * CELL;
            const TICK_SPEED = 85; // Fast, suspenseful movement

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const ui = {
                level: document.getElementById('ui-level'),
                levelOverlay: document.getElementById('levelUpOverlay'),
                nextLevelText: document.getElementById('nextLevelText')
            };

            // --- Audio Engine ---
            let audioCtx = null;
            const initAudio = () => {
                if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            };
            window.addEventListener('click', initAudio, { once: true });
            window.addEventListener('touchstart', initAudio, { once: true });

            const playSound = (type) => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;
                    if (type === 'move') {
                        osc.type = 'square'; osc.frequency.setValueAtTime(120, now);
                        gain.gain.setValueAtTime(0.01, now); 
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                        osc.start(now); osc.stop(now + 0.03);
                    } else if (type === 'eat') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                        gain.gain.setValueAtTime(0.05, now); 
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                    } else if (type === 'levelup') {
                        osc.type = 'triangle'; 
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.setValueAtTime(600, now + 0.1);
                        osc.frequency.setValueAtTime(800, now + 0.2);
                        gain.gain.setValueAtTime(0.1, now); 
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4);
                    }
                } catch(e) {}
            };

            // --- Game State ---
            let maze = [];
            let snake = [];
            let apples = [];
            let dir = { x: 1, y: 0 };
            let level = 1;
            let lastTick = 0;
            let isGameOver = false;
            let isTransitioning = false;

            // --- Maze Generation ---
            function generateMaze() {
                maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1)); // 1 = Wall
                
                const stack = [];
                const startX = 1, startY = 1;
                maze[startY][startX] = 0; // 0 = Path
                stack.push({ x: startX, y: startY });

                const dirs = [{x:2,y:0}, {x:-2,y:0}, {x:0,y:2}, {x:0,y:-2}];

                while (stack.length > 0) {
                    let curr = stack[stack.length - 1];
                    let neighbors = [];

                    for (let d of dirs) {
                        let nx = curr.x + d.x;
                        let ny = curr.y + d.y;
                        if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && maze[ny][nx] === 1) {
                            neighbors.push({ x: nx, y: ny, wx: curr.x + d.x / 2, wy: curr.y + d.y / 2 });
                        }
                    }

                    if (neighbors.length > 0) {
                        let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                        maze[next.wy][next.wx] = 0;
                        maze[next.y][next.x] = 0;
                        stack.push({ x: next.x, y: next.y });
                    } else {
                        stack.pop();
                    }
                }
            }

            function resetLevel() {
                generateMaze();
                
                let startX = 1, startY = 1;
                while (maze[startY][startX] !== 0) { startX += 2; startY += 2; }

                snake = [];
                for (let i = 0; i < 4; i++) snake.push({ x: startX, y: startY });
                dir = { x: 1, y: 0 };
                
                // Fill board with Apples
                apples = [];
                for (let y = 1; y < ROWS - 1; y++) {
                    for (let x = 1; x < COLS - 1; x++) {
                        if (maze[y][x] === 0 && Math.random() < 0.7) { // 70% density
                            if (!snake.some(s => s.x === x && s.y === y)) {
                                apples.push({ x, y });
                            }
                        }
                    }
                }
                
                isTransitioning = false;
                isGameOver = false;
            }

            // --- Pathfinding AI ---
            const DIRS = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
            
            function getDistancesFromHead() {
                let dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
                let q = [{ x: snake[0].x, y: snake[0].y, d: 0 }];
                dist[snake[0].y][snake[0].x] = 0;
                
                let head = 0;
                while(head < q.length) {
                    let curr = q[head++];
                    for(let d of DIRS) {
                        let nx = curr.x + d.x, ny = curr.y + d.y;
                        if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && maze[ny][nx] === 0) {
                            if(dist[ny][nx] === Infinity && !snake.some(s => s.x === nx && s.y === ny)) {
                                dist[ny][nx] = curr.d + 1;
                                q.push({ x: nx, y: ny, d: curr.d + 1 });
                            }
                        }
                    }
                }
                return dist;
            }

            function getFreeSpace(x, y, occupiedSet) {
                let space = 0;
                let stack = [{x, y}];
                let visited = new Set();
                visited.add(`${x},${y}`);

                while(stack.length > 0) {
                    let curr = stack.pop();
                    space++;
                    if(space > 150) return space; 
                    
                    for(let d of DIRS) {
                        let nx = curr.x + d.x, ny = curr.y + d.y;
                        let key = `${nx},${ny}`;
                        if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && maze[ny][nx] === 0 && !visited.has(key) && !occupiedSet.has(key)) {
                            visited.add(key);
                            stack.push({x: nx, y: ny});
                        }
                    }
                }
                return space;
            }

            function getNextMove() {
                const head = snake[0];
                let occupied = new Set();
                for(let s of snake) occupied.add(`${s.x},${s.y}`);

                let validMoves = [];
                for(let d of DIRS) {
                    let nx = head.x + d.x, ny = head.y + d.y;
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && maze[ny][nx] === 0) {
                        // Ignore tail since it will move
                        let isBody = false;
                        for(let i=0; i<snake.length-1; i++) {
                            if(snake[i].x === nx && snake[i].y === ny) { isBody = true; break; }
                        }
                        if(!isBody) validMoves.push({x: d.x, y: d.y, nx, ny});
                    }
                }

                if (validMoves.length === 0) return null;

                let distMap = getDistancesFromHead();
                let bestMoves = [];
                let minDist = Infinity;
                
                for(let m of validMoves) {
                    let d = distMap[m.ny][m.nx];
                    if(d < minDist) { minDist = d; bestMoves = [m]; } 
                    else if(d === minDist) { bestMoves.push(m); }
                }

                let safestMove = null;
                let maxSpace = -1;

                bestMoves.sort(() => Math.random() - 0.5);

                for(let m of bestMoves) {
                    let tempOcc = new Set(occupied);
                    tempOcc.add(`${m.nx},${m.ny}`);
                    let space = getFreeSpace(m.nx, m.ny, tempOcc);
                    if(space > maxSpace) {
                        maxSpace = space;
                        safestMove = m;
                    }
                    // If large space, take it to be safe
                    if(space > snake.length + 5) { safestMove = m; break; }
                }

                if(!safestMove) {
                    for(let m of validMoves) {
                        let tempOcc = new Set(occupied);
                        tempOcc.add(`${m.nx},${m.ny}`);
                        let space = getFreeSpace(m.nx, m.ny, tempOcc);
                        if(space > maxSpace) { maxSpace = space; safestMove = m; }
                    }
                }

                return safestMove ? { x: safestMove.x, y: safestMove.y } : null;
            }

            // --- Game Loop ---
            function updateGame() {
                if (isGameOver || isTransitioning) return;

                const nextDir = getNextMove();
                if (!nextDir) { triggerLevelUp(); return; }

                dir = nextDir;
                const head = snake[0];
                const newHead = { x: head.x + dir.x, y: head.y + dir.y };

                snake.unshift(newHead);
                playSound('move');

                let appleIdx = apples.findIndex(a => a.x === newHead.x && a.y === newHead.y);
                if (appleIdx !== -1) {
                    playSound('eat');
                    apples.splice(appleIdx, 1);
                    
                    // Replenish apple
                    let emptySpots = [];
                    for (let y = 1; y < ROWS - 1; y++) {
                        for (let x = 1; x < COLS - 1; x++) {
                            if (maze[y][x] === 0 && !snake.some(s => s.x === x && s.y === y) && !apples.some(a => a.x === x && a.y === y)) {
                                emptySpots.push({x, y});
                            }
                        }
                    }
                    if (emptySpots.length > 0 && apples.length < 70) {
                        apples.push(emptySpots[Math.floor(Math.random() * emptySpots.length)]);
                    }
                } else {
                    snake.pop();
                }
            }

            function triggerLevelUp() {
                isTransitioning = true;
                level++;
                ui.nextLevelText.textContent = level;
                ui.levelOverlay.classList.add('show');
                playSound('levelup');

                setTimeout(() => {
                    ui.levelOverlay.classList.remove('show');
                    ui.level.textContent = "LEVEL " + level;
                    resetLevel();
                }, 2200);
            }

            // --- Rendering ---
            function draw() {
                // 1. Background
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, W, H);

                // 2. Checkerboard
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if ((x + y) % 2 === 0) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                            ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
                        }
                    }
                }

                // 3. Maze Walls (Green Rounded)
                ctx.fillStyle = '#22c55e'; 
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#22c55e';
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (maze[y][x] === 1) {
                            ctx.beginPath();
                            ctx.roundRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2, 5);
                            ctx.fill();
                        }
                    }
                }
                ctx.shadowBlur = 0;

                // 4. Apples
                for (let a of apples) {
                    let cx = a.x * CELL + CELL / 2;
                    let cy = a.y * CELL + CELL / 2;
                    ctx.fillStyle = '#32cd32';
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(cx - 3, cy - 3, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 5. Snake (Continuous Cyan Ribbon)
                if (snake.length > 0) {
                    ctx.strokeStyle = '#00bfff';
                    ctx.lineWidth = CELL * 0.8;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00bfff';

                    ctx.beginPath();
                    for (let i = 0; i < snake.length; i++) {
                        let cx = snake[i].x * CELL + CELL / 2;
                        let cy = snake[i].y * CELL + CELL / 2;
                        if (i === 0) ctx.moveTo(cx, cy);
                        else ctx.lineTo(cx, cy);
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0; 

                    // Head Details (Eyes)
                    let head = snake[0];
                    let hx = head.x * CELL + CELL / 2;
                    let hy = head.y * CELL + CELL / 2;
                    
                    ctx.fillStyle = '#fff';
                    let e1x = hx + (dir.x * 6) - (dir.y * 5);
                    let e1y = hy + (dir.y * 6) + (dir.x * 5);
                    let e2x = hx + (dir.x * 6) + (dir.y * 5);
                    let e2y = hy + (dir.y * 6) - (dir.x * 5);
                    
                    ctx.beginPath(); ctx.arc(e1x, e1y, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(e2x, e2y, 4, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(e1x + dir.x*1.5, e1y + dir.y*1.5, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(e2x + dir.x*1.5, e2y + dir.y*1.5, 2, 0, Math.PI * 2); ctx.fill();
                }
            }

            // --- Main Loop ---
            function loop(time) {
                requestAnimationFrame(loop);
                if (!lastTick) lastTick = time;
                if (time - lastTick >= TICK_SPEED) {
                    updateGame();
                    lastTick = time;
                }
                draw();
            }

            // Polyfill for older browsers
            if(!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
                    this.beginPath(); this.moveTo(x+r, y);
                    this.arcTo(x+w, y, x+w, y+h, r); this.arcTo(x+w, y+h, x, y+h, r);
                    this.arcTo(x, y+h, x, y, r); this.arcTo(x, y, x+w, y, r);
                    this.closePath(); return this;
                }
            }

            // Init
            try { resetLevel(); requestAnimationFrame(loop); } 
            catch(e) { console.error(e); }

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) lastTick = performance.now();
            });
        })();
    </script>
</body>
</html>
